; pytest configuration for the regression tests in tests/ (see docs/TESTING.md).
; Run everything with `py -m pytest`, or use the Testing panel (beaker icon) in VS Code.
[pytest]
testpaths = tests
; repo root on sys.path so tests can `import ppiq`, `import ark_common`, ...
pythonpath = .
; -ra: list skipped / expected-failure tests at the end with their reasons
addopts = -ra
; a known-bug test (xfail) that starts passing fails the run, so its marker and KNOWN_ISSUES entry get removed
xfail_strict = true
; doc_inventory_*.py use PyPDF2, which warns that it is deprecated on every import
filterwarnings =
    ignore:PyPDF2 is deprecated:DeprecationWarning
markers =
    cpp: compiles C++ with MSVC into a temp folder (adds about 20 seconds)
    app: launches a test build of phxcpp.exe with stand-in scripts and clicks its buttons
